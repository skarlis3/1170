<!--
  ENGL 1170 co-requisite — calendar SLOT B.

  The filename carries no weekday on purpose. There are only ever two 1170
  calendars and they are reused term to term; which day each one holds changes,
  and which 1181 section it is attached to changes too, so a day in the filename
  goes stale and a rename breaks links. The day lives in the <h1>, the tab title
  and the nav label, where students actually read it — and in this note.

  Fall 2026: section S1620, Thu 3:00-3:55 PM, F-310.
  Paired with the Thursday hybrid ENGL 1181 (H1620 co-req + H1621 standalone).
  This calendar held Winter 2026's Tuesday section, which is why the file used
  to be called tuesday-calendar.html.
  Google Calendar ID f3df4847... — the ID is the identity, never the name.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thursday Calendar | ENGL 1170</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="calendar.css">
  <link rel="icon" href="/1170icon.png" type="image/x-icon">
</head>
<body>
  <div id="page-content">
    <h1>Thursday Calendar</h1>
    <div id="calendarContainer" data-calendar-id="f3df4847b18f876bda1420bdce9d5710558f73557203b228f5775fb4768ccad6@group.calendar.google.com">
      <!-- Tab Navigation -->
      <div class="calendar-tabs" role="tablist">
        <button class="calendar-tab active" role="tab" aria-selected="true" data-tab="weekly">Next 3 Weeks</button>
        <button class="calendar-tab" role="tab" aria-selected="false" data-tab="upcoming">Upcoming</button>
        <button class="calendar-tab" role="tab" aria-selected="false" data-tab="monthly">Monthly</button>
        <a href="https://calendar.google.com/calendar/embed?src=f3df4847b18f876bda1420bdce9d5710558f73557203b228f5775fb4768ccad6%40group.calendar.google.com&ctz=America%2FDetroit" target="_blank" rel="noopener" class="cal-btn cal-btn--view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          View in Google Calendar
        </a>
      </div>

      <!-- WEEKLY TAB -->
      <div class="tab-panel active" id="panel-weekly" role="tabpanel">
        <h2 class="panel-title">The Next Three Weeks</h2>
        <div class="three-week-view" id="weeklyView">
          <div class="calendar-loading">Loading...</div>
        </div>
      </div>

      <!-- UPCOMING TAB -->
      <div class="tab-panel" id="panel-upcoming" role="tabpanel">
        <h2 class="panel-title">Upcoming Due Dates</h2>
        <div class="countdown-cards" id="upcomingView">
          <div class="calendar-loading">Loading...</div>
        </div>
      </div>

      <!-- MONTHLY TAB -->
      <div class="tab-panel" id="panel-monthly" role="tabpanel">
        <h2 class="panel-title">Month at a Glance</h2>
        <div class="month-controls">
          <button class="prev-month-btn" aria-label="Previous month">←</button>
          <span class="current-month">January 2025</span>
          <button class="next-month-btn" aria-label="Next month">→</button>
          <button class="today-btn">Today</button>
        </div>
        <div class="calendar-grid" id="monthlyView">
          <div class="calendar-loading">Loading...</div>
        </div>
      </div>

      <!-- Day Popup. A real <dialog>, opened with showModal(), so the keyboard
           can reach and leave it. The separate backdrop divs are gone; the
           browser draws the dim layer via ::backdrop. -->
      <dialog class="day-popup" id="dayPopup" aria-labelledby="dayPopupTitle">
        <button type="button" class="popup-close" aria-label="Close">×</button>
        <h3 id="dayPopupTitle">Events</h3>
        <div id="dayPopupEvents"></div>
      </dialog>

      <!-- Event Detail Popup -->
      <dialog class="day-popup" id="eventPopup" aria-labelledby="eventPopupTitle">
        <button type="button" class="popup-close" aria-label="Close">×</button>
        <h3 id="eventPopupTitle">Event</h3>
        <div class="event-popup-time" id="eventPopupTime"></div>
        <div class="event-popup-desc" id="eventPopupDescription"></div>
      </dialog>
    </div>
  </div>
  <script src="/nav.js"></script>
  <script src="/footer.js" defer></script>
  <script src="calendar.js" defer></script>
</body>
</html>
